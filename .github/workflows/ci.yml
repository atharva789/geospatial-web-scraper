name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go test (rag_service)
        working-directory: internal/services/rag_service
        run: go test ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build UI
        working-directory: web/rag-ui
        run: |
          npm install
          npm run build

      - name: Python lint (syntax check)
        run: |
          python -m py_compile internal/services/transformation_service/dataset_consumer.py
          python -m py_compile internal/services/querygen_service/main.py internal/services/querygen_service/querygen.py
