services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_container
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-geospatial_datasets}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  go_crawler:
    build:
      context: ../../internal/services/crawler_service/
      dockerfile: crawler.Dockerfile
    env_file:
      - ./.env
    container_name: go_crawler_container
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/geospatial_datasets?sslmode=disable}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-geospatial_datasets}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  querygen_python:
    build:
      context: ../../internal/services/querygen_service/
      dockerfile: querygen.Dockerfile
    env_file:
      - ./.env
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DATABASE_URL: ${QUERYGEN_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/geospatial_datasets}
    container_name: querygen_container
    ports:
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy

  rag_backend:
    build:
      context: ../../internal/services/rag_service/
      dockerfile: rag.Dockerfile
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${RAG_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/geospatial_datasets?sslmode=disable}
      VECTORDB_HOST: ${VECTORDB_HOST:-postgres}
      VECTORDB_PORT: ${VECTORDB_PORT:-5432}
      VECTORDB_NAME: ${VECTORDB_NAME:-geospatial_datasets}
      VECTORDB_USER: ${VECTORDB_USER:-postgres}
      VECTORDB_PASSWORD: ${VECTORDB_PASSWORD:-postgres}
      VECTORDB_TABLE: ${VECTORDB_TABLE:-dataset_vectors}
      VECTOR_DIM: ${VECTOR_DIM:-1536}
      BEDROCK_EMBED_MODEL: ${BEDROCK_EMBED_MODEL:-amazon.titan-embed-text-v1}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RAG_LISTEN_ADDR: ${RAG_LISTEN_ADDR:-:8082}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"

  rag_frontend:
    build:
      context: ../../web/rag-ui
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://rag_backend:8082}
    depends_on:
      - rag_backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
